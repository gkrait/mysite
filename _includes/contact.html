<script>
    var form = document.getElementById("contactform"); // Changed "my-form" to "contactform" to match the form's ID

    async function handleSubmit(event) {
        event.preventDefault();
        var status = document.getElementById("contact-status"); // Changed "my-form-status" to "contact-status"
        var data = new FormData(event.target);
        fetch(event.target.action, {
            method: form.method,
            body: data,
            headers: {
                'Accept': 'application/json'
            }
        }).then(response => {
            if (status) {
                status.innerHTML = "Thanks for your submission!";
            }
            if (form) {
                form.reset();
            }
        }).catch(error => {
            if (status) {
                status.innerHTML = "Oops! There was a problem submitting your form";
            }
        });
    }
    if (form) {
        form.addEventListener("submit", handleSubmit);
    }
</script>
